<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>my-chronicle</title>
  
  <!-- Exif 解析ライブラリ（ローカル写真の日時抽出用のみ残す） -->
  <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --accent: #38bdf8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background: var(--bg-color);
      color: var(--text-main);
      -webkit-text-size-adjust: 100%;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.4rem;
      margin: 0 0 4px 0;
      color: #fff;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 160px;
    }

    label {
      font-size: 0.8rem;
      font-weight: bold;
      color: var(--text-muted);
    }

    input[type="text"],
    input[type="date"] {
      height: 40px;
      padding: 0 12px;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
      box-sizing: border-box;
    }

    input[type="text"]:focus,
    input[type="date"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn {
      height: 40px;
      padding: 0 16px;
      font-size: 0.9rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #fff;
      background: #334155;
      transition: background 0.15s ease, opacity 0.15s ease;
      white-space: nowrap;
    }

    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary { background: var(--primary); }
    .btn-success { background: var(--success); }
    .btn-warning { background: var(--warning); color: #000; }
    .btn-danger { background: var(--danger); }

    .action-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .drop-zone {
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .drop-zone.dragover {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.05);
      color: var(--accent);
    }

    .photo-result {
      margin-top: 10px;
      padding: 10px 12px;
      background: #0f172a;
      border-radius: 6px;
      border-left: 4px solid var(--accent);
      font-size: 0.85rem;
      display: none;
    }

    .table-container {
      overflow-x: auto;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      text-align: left;
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
      vertical-align: top;
    }

    th {
      background: #162032;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .col-year { width: 70px; font-weight: bold; color: var(--accent); }
    .col-age { width: 60px; color: var(--text-muted); }
    .col-career { width: 25%; }
    .col-events { width: 35%; }
    .col-news { width: 30%; color: #cbd5e1; font-size: 0.85rem; }

    td.editable {
      cursor: text;
      white-space: pre-wrap;
      word-break: break-word;
    }

    td.editable:focus {
      outline: 2px solid var(--accent);
      background: rgba(56, 189, 248, 0.1);
      border-radius: 4px;
    }

    tr.highlight-row {
      background-color: rgba(56, 189, 248, 0.2) !important;
      animation: flashHighlight 1.5s ease-out;
    }

    @keyframes flashHighlight {
      0% { background-color: rgba(56, 189, 248, 0.5); }
      100% { background-color: rgba(56, 189, 248, 0.2); }
    }

    #scrollTopBtn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #1d63a8;
      border: none;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.15s ease, background 0.2s ease;
      z-index: 999;
    }

    #scrollTopBtn svg {
      width: 22px;
      height: 22px;
      stroke: #ffffff;
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    #scrollTopBtn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #scrollTopBtn:hover {
      background: #154c82;
      transform: translateY(-2px);
    }

    #scrollTopBtn:active {
      transform: scale(0.94);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>my-chronicle</h1>
    <div class="subtitle">年代別パーソナル年表・ライフログマネージャー</div>
  </header>

  <section class="card input-section">
    <div class="form-row">
      <div class="form-group">
        <label for="userName">氏名</label>
        <input type="text" id="userName" placeholder="例: 山田 太郎">
      </div>
      <div class="form-group">
        <label for="birthDate">生年月日</label>
        <input type="date" id="birthDate">
      </div>
      <button id="generateBtn" class="btn btn-primary">年表作成</button>
      <button id="initImportCsvBtn" class="btn">📂 CSV読込</button>
    </div>
  </section>

  <!-- 写真連携カード -->
  <section class="card" id="photoSection" style="display: none;">
    <div style="font-size: 0.9rem; font-weight: bold; color: var(--text-muted); margin-bottom: 8px;">📷 撮影日時から該当年を自動検索</div>
    <div id="dropZone" class="drop-zone">
      ローカル写真をここにドラッグ＆ドロップ、またはクリックして選択（Exif解析）
    </div>
    <input type="file" id="fileInput" accept="image/*" style="display: none;">
    <div id="photoResult" class="photo-result"></div>
  </section>

  <!-- 操作アクションバー -->
  <div class="action-bar" id="actionBar" style="display: none;">
    <button id="saveBtn" class="btn">💾 一時保存</button>
    <button id="exportCsvBtn" class="btn btn-success">📥 CSV出力</button>
    <button id="importCsvBtn" class="btn">📂 CSV読込</button>
    <button id="driveBackupBtn" class="btn btn-warning">☁️ ドライブ保存</button>
    <button id="clearBtn" class="btn btn-danger" style="margin-left: auto;">🗑️ リセット</button>
  </div>
  <input type="file" id="csvFileInput" accept=".csv" style="display: none;">

  <!-- 年表テーブル -->
  <section class="table-container" id="tableSection" style="display: none;">
    <table>
      <thead>
        <tr>
          <th>西暦</th>
          <th>年齢</th>
          <th>学歴・職歴</th>
          <th>旅行・イベント</th>
          <th>日本・海外のニュース</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </section>
</div>

<button id="scrollTopBtn" title="トップへ戻る" aria-label="トップへ戻る">
  <svg viewBox="0 0 24 24">
    <polyline points="18 15 12 9 6 15"></polyline>
  </svg>
</button>

<script>
  // ====== 中継用 GAS Web App URL ======
  const GAS_API_URL = "ここにデプロイしたWebアプリURLを貼り付け";

  const historicalNews = {
    1964: "東京オリンピック開催、東海道新幹線開業",
    1968: "3億円事件発生",
    1969: "アポロ11号月面着陸",
    1970: "日本万国博覧会（大阪万博）開催",
    1972: "日中国交正常化、札幌冬季五輪、あさま山荘事件",
    1973: "第1次オイルショック",
    1976: "ロッキード事件",
    1979: "インベーダーゲーム大ブーム",
    1983: "東京ディズニーランド開園、任天堂ファミコン発売",
    1985: "日本航空123便事故、つくば科学万博",
    1986: "バブル経済期へ突入、チェルノブイリ原発事故",
    1989: "昭和から平成へ（1月8日改元）、消費税導入（3%）、東西冷戦終結",
    1990: "東西ドイツ統一",
    1991: "バブル崩壊、湾岸戦争",
    1993: "Jリーグ開幕",
    1995: "阪神・淡路大震災、地下鉄サリン事件、Windows 95発売",
    1997: "消費税5%に引き上げ",
    1998: "長野冬季オリンピック開催",
    2000: "2000年問題、シドニー五輪",
    2001: "アメリカ同時多発テロ事件（9.11）",
    2002: "日韓ワールドカップ共催",
    2008: "リーマン・ショック",
    2011: "東日本大震災（3.11）",
    2014: "消費税8%に引き上げ",
    2019: "平成から令和へ（5月1日改元）、消費税10%に引き上げ",
    2020: "新型コロナウイルス世界的流行、東京五輪延期",
    2021: "東京2020オリンピック・パラリンピック開催",
    2022: "ロシアによるウクライナ侵攻",
    2024: "能登半島地震",
    2025: "大阪・関西万博開催"
  };

  // DOM要素
  const userNameInput = document.getElementById("userName");
  const birthDateInput = document.getElementById("birthDate");
  const generateBtn = document.getElementById("generateBtn");
  const initImportCsvBtn = document.getElementById("initImportCsvBtn");
  const photoSection = document.getElementById("photoSection");
  const actionBar = document.getElementById("actionBar");
  const tableSection = document.getElementById("tableSection");
  const tableBody = document.getElementById("tableBody");
  const dropZone = document.getElementById("dropZone");
  const fileInput = document.getElementById("fileInput");
  const photoResult = document.getElementById("photoResult");
  const saveBtn = document.getElementById("saveBtn");
  const importCsvBtn = document.getElementById("importCsvBtn");
  const csvFileInput = document.getElementById("csvFileInput");
  const exportCsvBtn = document.getElementById("exportCsvBtn");
  const driveBackupBtn = document.getElementById("driveBackupBtn");
  const clearBtn = document.getElementById("clearBtn");
  const scrollTopBtn = document.getElementById("scrollTopBtn");

  const CURRENT_YEAR = new Date().getFullYear();

  // 初期化処理
  window.addEventListener("DOMContentLoaded", () => {
    const savedData = localStorage.getItem("my_chronicle_data");
    if (savedData) {
      try {
        const data = JSON.parse(savedData);
        userNameInput.value = data.name || "";
        birthDateInput.value = data.birthDate || "";
        if (data.records && data.records.length > 0) {
          renderTable(data.birthDate, data.records);
        }
      } catch (e) {
        console.error("データ復元エラー:", e);
      }
    }
  });

  // トップに戻るボタン制御
  window.addEventListener("scroll", () => {
    if (window.scrollY > 250) {
      scrollTopBtn.classList.add("visible");
    } else {
      scrollTopBtn.classList.remove("visible");
    }
  });

  scrollTopBtn.addEventListener("click", () => {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  function highlightAndScrollToYear(photoYear) {
    const targetRow = document.getElementById(`row-${photoYear}`);
    if (targetRow) {
      document.querySelectorAll("tr.highlight-row").forEach(r => r.classList.remove("highlight-row"));
      targetRow.classList.add("highlight-row");
      targetRow.scrollIntoView({ behavior: "smooth", block: "center" });

      const eventCell = targetRow.querySelector(".col-events");
      if (eventCell && eventCell.innerText.trim() === "") {
        eventCell.focus();
      }
    } else {
      photoResult.innerHTML += `<br>※年表の範囲外（${photoYear}年）の写真です。`;
    }
  }

  // 入力欄の同期
  userNameInput.addEventListener("input", saveToLocalStorage);
  birthDateInput.addEventListener("change", () => {
    saveToLocalStorage();
    const records = extractTableData();
    if (records.length > 0) {
      renderTable(birthDateInput.value, records);
    }
  });

  // 年表生成
  generateBtn.addEventListener("click", () => {
    const birthVal = birthDateInput.value;
    if (!birthVal) {
      alert("生年月日を入力してください。");
      return;
    }
    renderTable(birthVal);
    saveToLocalStorage();
  });

  function renderTable(birthVal, savedRecords = null) {
    const birth = new Date(birthVal);
    const birthYear = birth.getFullYear();
    const birthMonth = birth.getMonth() + 1;
    const birthDay = birth.getDate();

    tableBody.innerHTML = "";

    const recordsMap = {};
    if (savedRecords) {
      savedRecords.forEach(r => {
        recordsMap[r.year] = r;
      });
    }

    for (let year = birthYear; year <= CURRENT_YEAR; year++) {
      const age = year - birthYear;
      const tr = document.createElement("tr");
      tr.id = `row-${year}`;

      let autoCareer = "";
      const isEarly = (birthMonth < 4) || (birthMonth === 4 && birthDay === 1);
      const schoolStartYear = birthYear + (isEarly ? 6 : 7);

      if (year === schoolStartYear) autoCareer = "小学校 入学";
      else if (year === schoolStartYear + 6) autoCareer = "小学校 卒業 / 中学校 入学";
      else if (year === schoolStartYear + 9) autoCareer = "中学校 卒業 / 高校 入学";
      else if (year === schoolStartYear + 12) autoCareer = "高校 卒業 / 大学 入学";
      else if (year === schoolStartYear + 16) autoCareer = "大学 卒業 / 就職";

      const saved = recordsMap[year] || {};
      const careerText = saved.career !== undefined ? saved.career : autoCareer;
      const eventsText = saved.events !== undefined ? saved.events : "";
      const newsText = saved.news !== undefined ? saved.news : (historicalNews[year] || "");

      const tdYear = document.createElement("td");
      tdYear.className = "col-year";
      tdYear.textContent = year;

      const tdAge = document.createElement("td");
      tdAge.className = "col-age";
      tdAge.textContent = `${age}歳`;

      const tdCareer = document.createElement("td");
      tdCareer.className = "col-career editable";
      tdCareer.contentEditable = "true";
      tdCareer.innerText = careerText;

      const tdEvents = document.createElement("td");
      tdEvents.className = "col-events editable";
      tdEvents.contentEditable = "true";
      tdEvents.innerText = eventsText;

      const tdNews = document.createElement("td");
      tdNews.className = "col-news editable";
      tdNews.contentEditable = "true";
      tdNews.innerText = newsText;

      [tdCareer, tdEvents, tdNews].forEach(td => {
        td.addEventListener("input", saveToLocalStorage);
      });

      tr.appendChild(tdYear);
      tr.appendChild(tdAge);
      tr.appendChild(tdCareer);
      tr.appendChild(tdEvents);
      tr.appendChild(tdNews);

      tableBody.appendChild(tr);
    }

    photoSection.style.display = "block";
    actionBar.style.display = "flex";
    tableSection.style.display = "block";
  }

  // 写真Exif解析
  dropZone.addEventListener("click", () => fileInput.click());
  dropZone.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropZone.classList.add("dragover");
  });
  dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
  dropZone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropZone.classList.remove("dragover");
    if (e.dataTransfer.files.length > 0) {
      handleLocalPhoto(e.dataTransfer.files[0]);
    }
  });
  fileInput.addEventListener("change", (e) => {
    if (e.target.files.length > 0) {
      handleLocalPhoto(e.target.files[0]);
    }
  });

  async function handleLocalPhoto(file) {
    try {
      const exifData = await exifr.parse(file);
      if (exifData && exifData.DateTimeOriginal) {
        const dt = new Date(exifData.DateTimeOriginal);
        const photoYear = dt.getFullYear();
        const dateStr = `${photoYear}年${dt.getMonth() + 1}月${dt.getDate()}日`;

        photoResult.style.display = "block";
        photoResult.innerHTML = `<strong>撮影日時を検出:</strong> ${dateStr} の写真です。<br>該当行へスクロールしました。「旅行・イベント」列に入力してください。`;

        highlightAndScrollToYear(photoYear);
      } else {
        photoResult.style.display = "block";
        photoResult.textContent = "写真から撮影日時（Exif）を取得できませんでした。";
      }
    } catch (err) {
      console.error("Exif解析エラー:", err);
      photoResult.style.display = "block";
      photoResult.textContent = "画像ファイルの解析に失敗しました。";
    }
  }

  // 一時保存
  saveBtn.addEventListener("click", () => {
    saveToLocalStorage();
    alert("ブラウザに一時保存しました。");
  });

  function saveToLocalStorage() {
    const records = extractTableData();
    const data = {
      name: userNameInput.value,
      birthDate: birthDateInput.value,
      records: records
    };
    localStorage.setItem("my_chronicle_data", JSON.stringify(data));
  }

  function extractTableData() {
    const rows = tableBody.querySelectorAll("tr");
    const data = [];
    rows.forEach(tr => {
      data.push({
        year: tr.querySelector(".col-year").textContent.trim(),
        age: tr.querySelector(".col-age").textContent.trim(),
        career: tr.querySelector(".col-career").innerText.replace(/\r\n/g, '\n').trim(),
        events: tr.querySelector(".col-events").innerText.replace(/\r\n/g, '\n').trim(),
        news: tr.querySelector(".col-news").innerText.replace(/\r\n/g, '\n').trim()
      });
    });
    return data;
  }

  function generateCsvContent() {
    const records = extractTableData();
    const name = userNameInput.value || "";
    const birthDate = birthDateInput.value || "";

    let csv = `\uFEFF# Name: ${name}, BirthDate: ${birthDate}\n`;
    csv += "西暦,年齢,学歴・職歴,旅行・イベント,日本・海外のニュース\n";

    records.forEach(r => {
      const row = [
        `"${r.year}"`,
        `"${r.age}"`,
        `"${r.career.replace(/"/g, '""')}"`,
        `"${r.events.replace(/"/g, '""')}"`,
        `"${r.news.replace(/"/g, '""')}"`
      ];
      csv += row.join(",") + "\n";
    });
    return csv;
  }

  // ローカルCSVダウンロード
  exportCsvBtn.addEventListener("click", () => {
    const csv = generateCsvContent();
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `my-chronicle_${userNameInput.value || "履歴"}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  });

  // CSVインポート
  importCsvBtn.addEventListener("click", () => csvFileInput.click());
  if (initImportCsvBtn) {
    initImportCsvBtn.addEventListener("click", () => csvFileInput.click());
  }

  csvFileInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      const text = event.target.result;
      parseAndApplyCsv(text);
      csvFileInput.value = "";
    };
    reader.readAsText(file, "UTF-8");
  });

  function parseCSV(text) {
    const rows = [];
    let currentRow = [];
    let currentCell = '';
    let insideQuotes = false;
    let i = 0;

    if (text.charCodeAt(0) === 0xFEFF) {
      text = text.slice(1);
    }

    while (i < text.length) {
      const char = text[i];
      const nextChar = text[i + 1];

      if (char === '"') {
        if (insideQuotes && nextChar === '"') {
          currentCell += '"';
          i += 2;
          continue;
        } else {
          insideQuotes = !insideQuotes;
          i++;
          continue;
        }
      }

      if (!insideQuotes) {
        if (char === ',') {
          currentRow.push(currentCell.trim());
          currentCell = '';
          i++;
          continue;
        }
        if (char === '\r' || char === '\n') {
          if (char === '\r' && nextChar === '\n') {
            i++;
          }
          currentRow.push(currentCell.trim());
          if (currentRow.some(c => c !== '')) {
            rows.push(currentRow);
          }
          currentRow = [];
          currentCell = '';
          i++;
          continue;
        }
      }

      currentCell += char;
      i++;
    }

    if (currentCell !== '' || currentRow.length > 0) {
      currentRow.push(currentCell.trim());
      if (currentRow.some(c => c !== '')) {
        rows.push(currentRow);
      }
    }

    return rows;
  }

  function parseAndApplyCsv(csvText) {
    const rawLines = csvText.split(/\r\n|\n/);
    let parsedName = "";
    let parsedBirthDate = "";

    if (rawLines.length > 0 && rawLines[0].trim().startsWith("#")) {
      const metaLine = rawLines[0].trim();
      const nameMatch = metaLine.match(/Name:\s*([^,]*)/);
      const birthMatch = metaLine.match(/BirthDate:\s*([^,\r\n]*)/);

      if (nameMatch && nameMatch[1]) parsedName = nameMatch[1].trim();
      if (birthMatch && birthMatch[1]) parsedBirthDate = birthMatch[1].trim();
    }

    if (parsedName) userNameInput.value = parsedName;
    if (parsedBirthDate) birthDateInput.value = parsedBirthDate;

    const rows = parseCSV(csvText);
    if (rows.length < 2) {
      alert("有効なCSVデータではありません。");
      return;
    }

    const records = [];
    rows.forEach(row => {
      if (row[0].startsWith("#") || row[0] === "西暦") return;
      if (row.length < 5) return;

      const y = parseInt(row[0], 10);
      if (!isNaN(y)) {
        records.push({
          year: y,
          age: row[1],
          career: row[2],
          events: row[3],
          news: row[4]
        });
      }
    });

    if (records.length === 0) {
      alert("年表データの抽出に失敗しました。");
      return;
    }

    let birthVal = birthDateInput.value;
    if (!birthVal) {
      birthVal = `${records[0].year}-01-01`;
      birthDateInput.value = birthVal;
    }

    renderTable(birthVal, records);
    saveToLocalStorage();
    alert("CSVから年表データを復元しました。");
  }

  // ====== GAS経由のGoogleドライブ自動保存 ======
  driveBackupBtn.addEventListener("click", async () => {
    const records = extractTableData();
    if (records.length === 0) {
      alert("保存する年表データがありません。");
      return;
    }

    if (!GAS_API_URL || GAS_API_URL.includes("ここにデプロイした")) {
      alert("GAS_API_URL が設定されていません。GASのデプロイURLを入力してください。");
      return;
    }

    driveBackupBtn.disabled = true;
    driveBackupBtn.textContent = "☁️ ドライブ保存中...";

    try {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const fileName = `mychronicle_${yyyy}${mm}${dd}.csv`;
      const csvContent = generateCsvContent();

      // GAS Web App へ POST 送信
      const response = await fetch(GAS_API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({
          fileName: fileName,
          content: csvContent
        })
      });

      const resData = await response.json();

      if (resData.status === "success") {
        alert(`Googleドライブへ保存しました:\nマイドライブ/90_Tools/${fileName}`);
      } else {
        throw new Error(resData.message || "Unknown error");
      }
    } catch (err) {
      console.error("Drive backup error:", err);
      alert("ドライブ保存に失敗しました: " + (err.message || err));
    } finally {
      driveBackupBtn.disabled = false;
      driveBackupBtn.textContent = "☁️ ドライブ保存";
    }
  });

  // リセット
  clearBtn.addEventListener("click", () => {
    if (confirm("入力した内容をすべてクリアしますか？")) {
      localStorage.removeItem("my_chronicle_data");
      location.reload();
    }
  });
</script>
</body>
